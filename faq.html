<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequently Asked Questions | Swift Express Logistics</title>
  <meta name="description" content="Find answers to common questions about shipping, tracking, customs clearance, and delivery timelines.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#0A2F6D">
  <link rel="canonical" href="https://www.swiftexpress.com/faq.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta property="og:title" content="Swift Express FAQ">
  <meta property="og:description" content="Find answers to common questions about shipping, tracking, customs clearance, and delivery timelines.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.swiftexpress.com/faq.html">
  <meta property="twitter:card" content="summary_large_image">
  
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div id="header-container"></div>

  <section style="background: linear-gradient(135deg, var(--primary) 0%, #002D62 100%); color: white; padding: 4rem 0;">
    <div class="container text-center">
      <h1 style="color: white; margin-bottom: 1rem;">Frequently Asked Questions</h1>
      <p style="color: rgba(255,255,255,0.8); max-width: 600px; margin: 0 auto;">Find instant answers to common questions about tracking, customs, billing, and freight services.</p>
    </div>
  </section>

  <section class="section-padding">
    <div class="container container-sm">
      <div id="faqAccordion" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>

  <div id="footer-container"></div>

  <script type="module">
    import { renderHeader } from '/js/components/header.js';
    import { renderFooter } from '/js/components/footer.js';
    import { cmsService } from '/js/services/cmsService.js';

    document.addEventListener('DOMContentLoaded', async () => {
      renderHeader();
      renderFooter();

      const faqs = await cmsService.getFAQs();
      const accordion = document.getElementById('faqAccordion');

      accordion.innerHTML = faqs.map((f, i) => `
        <div class="card" style="padding: 1.25rem; cursor: pointer;" onclick="this.querySelector('.faq-ans').classList.toggle('hidden')">
          <div class="flex-between">
            <h4 style="color: var(--primary);"><i class="fas fa-question-circle text-accent"></i> ${f.question}</h4>
            <i class="fas fa-chevron-down text-muted"></i>
          </div>
          <div class="faq-ans ${i === 0 ? '' : 'hidden'}" style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 0.75rem; color: var(--text-muted);">
            ${f.answer}
          </div>
        </div>
      `).join('');
    });
  </script>

  <style>
    .faq-ans.hidden { display: none; }
  </style>
</body>
</html>
